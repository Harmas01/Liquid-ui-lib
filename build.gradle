plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = '1.1.0+mc1.21.1-neoforge'
group = 'dev.liquidui'
base.archivesName = 'liquid-ui-library'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.252'
    mods {
        liquid_ui_library { sourceSet sourceSets.main }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
